name: Build AV-Twin iOS IPA

on:
  pull_request:
    branches: [ master ]
    paths:
      - 'IndoorCoordinateTracker/**'
      - 'IndoorCoordinateTracker.xcodeproj/**'
      - 'avtwin_linux/continuous.py'
      - 'avtwin_linux/tests/test_continuous.py'
      - '.github/workflows/build-avtwin-ios.yml'
  workflow_dispatch:
    inputs:
      sign_ipa:
        description: '使用仓库 Secrets 生成可安装的已签名 IPA'
        required: true
        type: boolean
        default: false
      export_method:
        description: 'Provisioning Profile 对应的导出方式'
        required: true
        type: choice
        default: development
        options:
          - development
          - ad-hoc

permissions:
  contents: read

jobs:
  build-ios:
    runs-on: macos-15

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Show Xcode version
        run: xcodebuild -version

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install protocol test dependencies
        run: python3 -m pip install -r avtwin_linux/requirements.txt

      - name: Validate Linux capture-request protocol
        run: python3 -m pytest -q avtwin_linux/tests/test_continuous.py

      - name: Build unsigned iPhone app
        run: >-
          xcodebuild
          -project IndoorCoordinateTracker.xcodeproj
          -scheme AVTwinIOSResponder
          -configuration Release
          -sdk iphoneos
          -destination 'generic/platform=iOS'
          -derivedDataPath .build/unsigned
          CODE_SIGNING_ALLOWED=NO
          CURRENT_PROJECT_VERSION=${{ github.run_number }}
          clean build

      - name: Package unsigned IPA
        run: |
          mkdir -p .build/unsigned-ipa/Payload
          cp -R .build/unsigned/Build/Products/Release-iphoneos/AVTwinIOSResponder.app .build/unsigned-ipa/Payload/
          cd .build/unsigned-ipa
          /usr/bin/zip -qry ../AVTwinIOSResponder-v0.13.2-unsigned.ipa Payload

      - name: Upload unsigned IPA
        uses: actions/upload-artifact@v7
        with:
          name: AVTwinIOSResponder-v0.13.2-unsigned
          path: .build/AVTwinIOSResponder-v0.13.2-unsigned.ipa
          if-no-files-found: error

      - name: Import Apple signing certificate
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.sign_ipa }}
        uses: apple-actions/import-codesign-certs@v7
        with:
          p12-file-base64: ${{ secrets.APPSTORE_CERTIFICATES_FILE_BASE64 }}
          p12-password: ${{ secrets.APPSTORE_CERTIFICATES_PASSWORD }}

      - name: Install provisioning profile
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.sign_ipa }}
        env:
          PROFILE_BASE64: ${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}
        run: |
          test -n "$PROFILE_BASE64"
          PROFILE_PATH="$RUNNER_TEMP/AVTwin.mobileprovision"
          PROFILE_PLIST="$RUNNER_TEMP/AVTwin-profile.plist"
          echo "$PROFILE_BASE64" | /usr/bin/base64 -D > "$PROFILE_PATH"
          /usr/bin/security cms -D -i "$PROFILE_PATH" > "$PROFILE_PLIST"
          PROFILE_UUID=$(/usr/libexec/PlistBuddy -c 'Print UUID' "$PROFILE_PLIST")
          mkdir -p "$HOME/Library/MobileDevice/Provisioning Profiles"
          cp "$PROFILE_PATH" "$HOME/Library/MobileDevice/Provisioning Profiles/$PROFILE_UUID.mobileprovision"

      - name: Archive signed app
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.sign_ipa }}
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
          PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
        run: >-
          xcodebuild
          -project IndoorCoordinateTracker.xcodeproj
          -scheme AVTwinIOSResponder
          -configuration Release
          -destination 'generic/platform=iOS'
          -archivePath .build/AVTwinIOSResponder.xcarchive
          CODE_SIGN_STYLE=Manual
          DEVELOPMENT_TEAM="$APPLE_TEAM_ID"
          PRODUCT_BUNDLE_IDENTIFIER="$IOS_BUNDLE_ID"
          PROVISIONING_PROFILE_SPECIFIER="$PROFILE_NAME"
          CURRENT_PROJECT_VERSION=${{ github.run_number }}
          clean archive

      - name: Create export options
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.sign_ipa }}
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          IOS_BUNDLE_ID: ${{ secrets.IOS_BUNDLE_ID }}
          PROFILE_NAME: ${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}
          EXPORT_METHOD: ${{ inputs.export_method }}
        run: |
          OPTIONS="$RUNNER_TEMP/ExportOptions.plist"
          plutil -create xml1 "$OPTIONS"
          /usr/libexec/PlistBuddy -c "Add :method string $EXPORT_METHOD" "$OPTIONS"
          /usr/libexec/PlistBuddy -c "Add :teamID string $APPLE_TEAM_ID" "$OPTIONS"
          /usr/libexec/PlistBuddy -c 'Add :signingStyle string manual' "$OPTIONS"
          /usr/libexec/PlistBuddy -c 'Add :stripSwiftSymbols bool true' "$OPTIONS"
          /usr/libexec/PlistBuddy -c 'Add :provisioningProfiles dict' "$OPTIONS"
          /usr/libexec/PlistBuddy -c "Add :provisioningProfiles:$IOS_BUNDLE_ID string $PROFILE_NAME" "$OPTIONS"

      - name: Export signed IPA
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.sign_ipa }}
        run: >-
          xcodebuild -exportArchive
          -archivePath .build/AVTwinIOSResponder.xcarchive
          -exportPath .build/signed
          -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist"

      - name: Rename and verify signed IPA
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.sign_ipa }}
        run: |
          IPA_PATH=$(find .build/signed -maxdepth 1 -name '*.ipa' -print -quit)
          test -n "$IPA_PATH"
          cp "$IPA_PATH" .build/AVTwinIOSResponder-v0.13.2-signed.ipa
          codesign --verify --deep --strict .build/AVTwinIOSResponder.xcarchive/Products/Applications/AVTwinIOSResponder.app

      - name: Upload signed installable IPA
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.sign_ipa }}
        uses: actions/upload-artifact@v7
        with:
          name: AVTwinIOSResponder-v0.13.2-signed
          path: .build/AVTwinIOSResponder-v0.13.2-signed.ipa
          if-no-files-found: error
